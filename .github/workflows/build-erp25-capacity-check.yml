name: build-erp25-capacity-check

on:
  push:
    branches:
      - tooling/erp25-capacity-check
    paths:
      - "tools/erp25-capacity-check/**"
      - ".github/workflows/build-erp25-capacity-check.yml"
  workflow_dispatch:

jobs:
  build-epf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install EPF tooling
        run: |
          python -m pip install --upgrade pip
          git clone --depth 1 https://github.com/Pradushkoai/1c-ai-dev-env.git tools/erp25-capacity-check/_builder
          python -m pip install "git+https://github.com/saby-integration/v8unpack.git@main"

      - name: BSL syntax analysis
        run: |
          mkdir -p tools/erp25-capacity-check/bsl-report
          curl -L --fail --retry 3 -o /tmp/bsl-language-server.jar \
            https://github.com/1c-syntax/bsl-language-server/releases/download/v1.0.7/bsl-language-server-1.0.7-exec.jar
          java -jar /tmp/bsl-language-server.jar analyze \
            -s tools/erp25-capacity-check \
            -r json \
            -o tools/erp25-capacity-check/bsl-report \
            -q
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("tools/erp25-capacity-check/bsl-report/bsl-json.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          errors = []
          for fi in data.get("fileinfos", []):
              for d in fi.get("diagnostics", []):
                  if d.get("severity") == "Error":
                      errors.append({
                          "file": fi.get("path"),
                          "line": d.get("range", {}).get("start", {}).get("line", 0) + 1,
                          "code": d.get("code"),
                          "message": d.get("message"),
                      })
          print("BSL errors:", len(errors))
          for e in errors:
              print(e)
          if errors:
              raise SystemExit(1)
          PY

      - name: Build EPF and verify round-trip
        run: |
          python tools/erp25-capacity-check/build.py

      - name: Verify EPF signature
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tools/erp25-capacity-check/dist/ПроверкаВыполнимостиПлана_ERP_2_5_22_186.epf")
          assert p.exists(), p
          sig = p.read_bytes()[:4]
          assert sig == bytes.fromhex("ffffff7f"), sig.hex()
          print("EPF:", p)
          print("size:", p.stat().st_size)
          print("signature:", sig.hex())
          PY

      - name: Upload EPF
        uses: actions/upload-artifact@v4
        with:
          name: erp25-capacity-check-epf
          path: tools/erp25-capacity-check/dist/ПроверкаВыполнимостиПлана_ERP_2_5_22_186.epf
          if-no-files-found: error
          retention-days: 14
